name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiment/requirements/train.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/train.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/preflight.py --allow-cpu --output /tmp/deepprobe-preflight.json
      - run: python scripts/check_public_release.py
