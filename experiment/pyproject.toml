[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepprobe-vlm"
version = "0.2.0"
description = "Reproducible native-looped video-language SFT and evaluation research baseline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.8,<3", "transformers==4.57.6", "accelerate>=1.10,<2", "huggingface-hub==0.36.0", "numpy>=1.26,<3", "Pillow>=10,<12", "av>=14,<17", "safetensors>=0.4.5,<1"]
data = ["huggingface-hub==0.36.0", "pyarrow>=17,<22"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
